AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Roadtrip Map backend — S3 (site + media) served by CloudFront, a Lambda API
  for publish/auth, DynamoDB for trip metadata, and CloudFront signed cookies
  so a single password check unlocks fast CDN delivery of all trip photos.

Parameters:
  CloudFrontPublicKey:
    Type: AWS::SSM::Parameter::Value<String>
    Description: >
      Name of the SSM String parameter that holds the PEM public key
      (e.g. /roadtrip/cf-public-key). CloudFormation resolves it to the PEM.
  PrivateKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding the PEM private key.
  CFDomain:
    Type: String
    Default: ""
    Description: >
      CloudFront domain (e.g. d123.cloudfront.net). Leave blank on the first
      deploy, then re-deploy with the value from the CloudFrontDomain output so
      signed cookies are scoped to the right host.
  CustomDomain:
    Type: String
    Default: ""
    Description: Optional custom domain (e.g. trips.tombolek.com). Blank = use only the cloudfront.net name.
  AcmCertArn:
    Type: String
    Default: ""
    Description: ARN of a us-east-1 ACM cert covering CustomDomain. Required only when CustomDomain is set.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512

Resources:

  # ---------------- storage ----------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]      # presigned PUT uploads from the browser
            AllowedHeaders: ["*"]
            MaxAge: 3000

  TripsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tripId
          AttributeType: S
      KeySchema:
        - AttributeName: tripId
          KeyType: HASH

  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  # Reverse-geocoding for day place-names (town). HERE allows storing results,
  # which we do (we cache the town string per day in DynamoDB).
  PlaceIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: !Sub "${AWS::StackName}-places"
      DataSource: Here
      DataSourceConfiguration:
        IntendedUse: Storage

  # HMAC key for signing owner session tokens (auto-generated, never leaves AWS)
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ---------------- API Lambda ----------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      Environment:
        Variables:
          TABLE: !Ref TripsTable
          ACCOUNTS_TABLE: !Ref AccountsTable
          MEDIA_BUCKET: !Ref MediaBucket
          CF_DOMAIN: !Ref CFDomain
          CF_KEY_PAIR_ID: !Ref SigningPublicKey
          PRIVATE_KEY_SECRET_ARN: !Ref PrivateKeySecretArn
          SESSION_SECRET_ARN: !Ref SessionSecret
          PLACE_INDEX: !Ref PlaceIndex
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: ["content-type"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountsTable
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref PrivateKeySecretArn
                - !Ref SessionSecret
        - Statement:
            - Effect: Allow
              Action: geo:SearchPlaceIndexForPosition
              Resource: !GetAtt PlaceIndex.Arn

  # ---------------- CloudFront ----------------
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SigningPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        Name: !Sub "${AWS::StackName}-pubkey"
        CallerReference: !Sub "${AWS::StackName}-pubkey"
        EncodedKey: !Ref CloudFrontPublicKey

  SigningKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub "${AWS::StackName}-keygroup"
        Items:
          - !Ref SigningPublicKey

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, [!Ref CustomDomain], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          - PathPattern: /trips/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
            TrustedKeyGroups:
              - !Ref SigningKeyGroup

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  CloudFrontDomain:
    Description: The domain your app + API + images are served from.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Description: Upload the PWA files (index.html, app.js, ...) here.
    Value: !Ref SiteBucket
  MediaBucketName:
    Value: !Ref MediaBucket
  ApiFunctionName:
    Description: Update its CF_DOMAIN env var after deploy (see runbook).
    Value: !Ref ApiFunction
